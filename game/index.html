<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Screenshot staging: ?demo=chase|beach|plaza|heist runs a live scene and sets
     window.__shotReady when it is ready to photograph; ?auto=1 runs the autopilot self-test. -->
<link rel="icon" href="data:,">
<title>Solmar Bay — Open World Crime</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1c2c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #autolog { position: absolute; left: 8px; bottom: 8px; color: #fff; font: 12px monospace;
    background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 4px; max-width: 560px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Walk with WASD, drive with E to enter a car, complete missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="autolog"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
