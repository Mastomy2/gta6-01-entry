<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0e14;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  canvas {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #4d8a4a;
    image-rendering: auto;
  }
  #status {
    position: fixed;
    left: 8px;
    bottom: 6px;
    color: rgba(255, 255, 255, 0.55);
    font: 12px monospace;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="status"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
